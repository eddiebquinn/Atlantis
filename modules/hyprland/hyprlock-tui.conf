# TUI-style hyprlock screen. Pure black, monospace, single prompt
# line at the bottom — mirrors the ly display manager so the
# pre-login and locked-session feel continuous.
#
# No wallpaper, no clock, no decorative labels. The lock screen
# exists for seconds, not minutes — anything more is noise.

background {
    monitor =
    color = rgba(0, 0, 0, 1.0)
}

# Hostname prompt + password input on a single line, anchored to the
# bottom-left like a shell prompt.
input-field {
    monitor =
    size = 600, 30
    outline_thickness = 0
    dots_size = 0.2
    dots_spacing = 0.3
    dots_center = false
    fade_on_empty = true
    placeholder_text = <i>$HOSTNAME</i>: <i>password</i>:
    placeholder_color = rgba(192, 192, 192, 1.0)
    fail_color = rgba(192, 96, 96, 1.0)
    position = 24, -24
    halign = left
    valign = bottom
    font_family = monospace
    font_size = 14
}
