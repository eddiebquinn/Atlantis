# Session lock screen — Layout 17 from mahaveergurjar/Hyprlock-Dots,
# adapted for atlantis. Centred authenticate box with hostname title,
# username/password labels, and a separate input-field to the right of
# the box. Visual feel is similar to ly's centred TUI prompt.

general {
    no_fade_in = true
    no_fade_out = true
    hide_cursor = true
    immediate_render = true
}

background {
    monitor =
    color = rgb(0, 0, 0)
    blur_passes = 1
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.8916
    vibrancy_darkness = 0.0
}

# Date + time above the box.
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +'%A, %B %d - %I:%M')"
    color = rgb(200, 200, 200)
    font_size = 15
    position = 0, 500
    halign = center
    valign = center
}

# Authenticate box outline.
shape {
    monitor =
    size = 500, 100
    color = rgba(0, 0, 0, 0)
    rounding = 0
    border_size = 2
    border_color = rgba(255, 255, 255, 1)
    rotate = 0
    position = 0, 0
    halign = center
    valign = center
}

# Title bar inside the box (hostname).
shape {
    monitor =
    size = 200, 20
    color = rgb(0, 0, 0)
    rounding = 0
    border_size = 2
    border_color = rgb(0, 0, 0)
    rotate = 0
    position = -130, 50
    halign = center
    valign = center
    zindex = 5
}

# Title text — adapted from upstream's "Authenticate into archlinux".
label {
    monitor =
    text = Authenticate into 8ug8ear
    color = rgba(216, 222, 233, 0.80)
    font_size = 11
    position = -130, 50
    halign = center
    valign = center
    zindex = 5
}

# Username label.
label {
    monitor =
    text = Username: eddie
    color = rgba(216, 222, 233, 0.80)
    font_size = 11
    position = -150, 15
    halign = center
    valign = center
    zindex = 1
}

# Password label.
label {
    monitor =
    text = Password:
    color = rgba(216, 222, 233, 0.80)
    font_size = 11
    position = -190, -15
    halign = center
    valign = center
    zindex = 5
}

# Password input field — transparent box, dots appear in space.
input-field {
    monitor =
    size = 200, 50
    outline_thickness = -1
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = false
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(0, 0, 0, 0)
    font_color = rgb(255, 255, 255)
    fade_on_empty = false
    placeholder_text =
    hide_input = false
    position = 800, -15
    halign = left
    valign = center
}

# Failure / status notification area (above the box).
label {
    monitor =
    text =
    color = rgba(255, 255, 255, 0.90)
    font_size = 14
    position = 0, 400
    halign = center
    valign = center
    zindex = 10
}
