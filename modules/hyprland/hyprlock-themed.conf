# Themed hyprlock screen. Tokyo-Night palette to match the session,
# session wallpaper dimmed in the background, large clock + date
# centred, password input below. Reachable via `atlantis.lock.style
# = "themed"`; the default is "tui" (hyprlock-tui.conf).

background {
    monitor =
    path = ${./wallpapers/black-triangle.png}
    color = rgba(26, 27, 38, 1.0)
    blur_passes = 2
    blur_size = 4
    brightness = 0.55
}

label {
    monitor =
    text = cmd[update:60000:] date +'%H:%M'
    color = rgba(187, 154, 247, 0.95)
    font_size = 90
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:3600000:] date +'%A, %d %B %Y'
    color = rgba(169, 177, 214, 0.85)
    font_size = 24
    position = 0, 60
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 240, 48
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(187, 154, 247, 0.6)
    inner_color = rgba(26, 27, 38, 0.8)
    font_color = rgba(169, 177, 214, 1.0)
    fade_on_empty = false
    placeholder_text =
    position = 0, -80
    halign = center
    valign = center
}
