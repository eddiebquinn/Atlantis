wallpaper {
    monitor =
    path = ~/.config/hypr/wallpapers/black-triangle.png
    fit_mode = cover
}

# Disable hyprpaper's per-session splash text (the "by dt, do
# year mean damage tracking or distrotube" / similar message
# that appears at the bottom of the wallpaper at session start).
#
# The splash defaults to 1 in hyprpaper main; this turns it off.
# Note: this is a SEPARATE config from Hyprland's
# misc:disable_splash_rendering. They guard different draws —
# the Hyprland one (already disabled via §2.2b) suppresses a
# similar text drawn by Hyprland's renderer; the hyprpaper one
# suppresses the text hyprpaper draws over the wallpaper.
# Disabling both is the safe default — the user wants no splash.
splash = false
